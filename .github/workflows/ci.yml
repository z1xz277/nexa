name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            setup/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:contract
        working-directory: setup
